name: verify-and-publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Generate disposable CI secrets
        run: |
          mkdir -m 700 secrets
          for name in db_admin_password db_app_password patient_one_token patient_two_token staff_token; do
            openssl rand -hex 32 > "secrets/$name"
            chmod 640 "secrets/$name"
          done
          chmod 600 secrets/db_admin_password
          chmod 644 secrets/db_app_password
          printf 'APP_VERSION=sha-%s\nHTTPS_PORT=8443\nHOST_GID=%s\n' "$GITHUB_SHA" "$(id -g)" > .env
      - name: Build test and runtime images
        run: docker compose build tests app
      - name: Start database
        run: docker compose up -d --wait db
      - name: Run format lint and API tests
        run: docker compose --profile test run --rm tests sh -c 'ruff format --check . && ruff check . && pytest -q'
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hospital-appointments:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Record local image ID and service state
        if: always()
        run: |
          docker image inspect hospital-appointments:sha-${GITHUB_SHA} --format 'IMAGE_ID={{.Id}}' || true
          docker compose ps
          docker compose logs --tail=50 db
      - name: Stop CI services
        if: always()
        run: docker compose down -v

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Set image repository
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: base
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Print immutable image digest
        run: echo "IMAGE=${IMAGE}@${{ steps.build.outputs.digest }}"
